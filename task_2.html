<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Registration Form</title>
</head>

<body>
    <h1>Conference Registration Form</h1>

    <form action="">
        <label for="fname">First Name:</label><br>
        <input type="text" placeholder="Enter your full name"><br>
        <label for="email">Email Address:</label><br>
        <input type="email" placeholder="Enter your email address"><br>
        <label for="age">Age</label><br>
        <input type="text" placeholder="18"><br><br>

        <p>Gender:</p>
        <input type="radio" name="gender">
        <label for="male">Male</label><br>
        <input type="radio" name="gender">
        <label for="female">Female</label><br><br>

        <p>Area of interest:</p>
        <input type="checkbox" id="ch1" name="ch1" value="Software Development">
        <label for="ch1"> Software Development</label><br>
        <input type="checkbox" id="ch2" name="ch2" value="Data Science">
        <label for="ch2"> Data Science</label><br>
        <input type="checkbox" id="ch3" name="ch" value="Cybersecurity">
        <label for="ch3"> Cybersecurity</label><br>
        <input type="checkbox" id="ch4" name="ch1" value="Artificial Intelligence">
        <label for="ch4"> Artificial Intelligence</label><br><br>
        
        <p>Experience Level:</p>
        <input type="radio" name="exp">
        <label for="beginner">Beginner</label><br>
        <input type="radio" name="exp">
        <label for="Intermediate">Intermediate</label><br>
        <input type="radio" name="exp">
        <label for="Advanced">Advanced</label><br><br>

        <p>Comments or Question:</p>
        <textarea name="comment" id="comment" placeholder="Any comments or question?"></textarea><br><br>

        <button>Submit</button>
        <button>Reset</button>
    </form>
</body>

</html>
